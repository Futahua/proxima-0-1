events { worker_connections 512; }
http {
 resolver 127.0.0.11 valid=10s;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 access_log off;
 server {
 listen 80;
 absolute_redirect off;
 client_max_body_size 1g;
 proxy_read_timeout 86400s;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Host $http_host;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-For $remote_addr;
 set $cloud http://appflowy_cloud:8000;
 set $auth http://gotrue:9999;
 set $web http://appflowy_web:80;
 set $admin http://admin_frontend:3000;
 set $s3 http://minio:9000;
 location = /papers-launch {
 default_type text/html;
 add_header Cache-Control "no-store";
 add_header Referrer-Policy "no-referrer";
 return 200 '<!doctype html><meta charset="utf-8"><title>AppFlowy</title><script>const p=new URLSearchParams(location.hash.slice(1)),w=p.get("workspace_id");if(!(w?.length===36&&/^[a-f0-9-]+/i.test(w))||!p.get("access_token")||!p.get("refresh_token")){document.body.textContent="Open AppFlowy from Papers.";}else{p.delete("workspace_id");localStorage.setItem("redirectTo","/papers-return/"+w);location.replace("/auth/callback#"+p);}</script>';
 }
 location ~ "^/papers-return/([a-fA-F0-9-]{36})$" { return 302 /app/$1; }
 location /gotrue/ { rewrite ^/gotrue(/.*)$ $1 break; proxy_pass $auth; }
 location /ws { proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_pass $cloud; }
 location /api { proxy_pass $cloud; }
 location /ai/ { proxy_pass $cloud; }
 location /console { proxy_pass $admin; }
 location /minio-api/ { rewrite ^/minio-api/(.*)$ /$1 break; proxy_request_buffering off; proxy_pass $s3; }
 location = / { return 302 /app; }
 location / { proxy_pass $web; }
 }
}
